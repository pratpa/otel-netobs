name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  discover:
    name: Discover modules
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.find.outputs.modules }}
    steps:
      - uses: actions/checkout@v4
      - id: find
        run: |
          mods=$(find extension receiver -name go.mod -exec dirname {} \; \
            | sort | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "modules=$mods" >> "$GITHUB_OUTPUT"
          echo "$mods"

  test:
    name: ${{ matrix.module }}
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.discover.outputs.modules) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: ${{ matrix.module }}/go.sum

      - name: Verify go.mod is tidy
        working-directory: ${{ matrix.module }}
        run: |
          cp go.mod go.mod.orig
          cp go.sum go.sum.orig
          go mod tidy
          diff go.mod go.mod.orig || { echo "::error::go.mod is not tidy"; exit 1; }
          diff go.sum go.sum.orig || { echo "::error::go.sum is not tidy"; exit 1; }

      - name: Build
        working-directory: ${{ matrix.module }}
        run: go build ./...

      - name: Vet
        working-directory: ${{ matrix.module }}
        run: go vet ./...

      - name: Test
        working-directory: ${{ matrix.module }}
        run: go test -race -count=1 -coverprofile=coverage.txt -covermode=atomic ./...

      - name: Coverage summary
        working-directory: ${{ matrix.module }}
        run: go tool cover -func=coverage.txt | tail -1

  lint:
    name: Lint
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.discover.outputs.modules) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - uses: golangci/golangci-lint-action@v6
        with:
          working-directory: ${{ matrix.module }}
